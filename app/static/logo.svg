<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="БИОМ">
  <title>БИОМ</title>
  <!-- Знак клуба: литера «б» — толстое кольцо и отсечённый хвост-флаг.
       Обведён по логотипу клуба. Если появится исходный вектор — замените файл.
       Внутренний стиль нужен для фавикона: в <img> и во вкладке браузера
       CSS страницы не действует, поэтому цвет выбирается по системной теме.
       В шапке сайта знак вставлен инлайном и красится через currentColor. -->
  <style>
    .mark { fill: #1f2430; }
    @media (prefers-color-scheme: dark) { .mark { fill: #e9edf1; } }
  </style>
  <path class="mark" fill-rule="evenodd"
        d="M31 62a21 21 0 1 1 0-42 21 21 0 0 1 0 42Zm0-13.5a9.5 9.5 0 1 0 0-19 9.5 9.5 0 0 0 0 19Z"/>
  <path class="mark" d="M22 27 56 2 48 21Z"/>
</svg>
